# Static Astro site → Cloudflare Workers assets.
# [build] runs before deploy so `dist/` exists when CI only runs `wrangler deploy`.
name = "warthunder-cheats-com"
compatibility_date = "2026-10-26"

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
